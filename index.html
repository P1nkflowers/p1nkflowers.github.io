<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1nk flowers</title>
    <style>
        @font-face {
            font-family: 'Comic Sans MS';
            src: url('fonts/comic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Comic Sans MS';
            src: url('fonts/comicbd.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Comic Sans MS';
            src: url('fonts/comici.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'Comic Sans MS';
            src: url('fonts/comicz.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }

        :root {
            --beat-glow: 0px;
            --beat-color-pulse: #ffb6c1;
        }

        body {
            background-color: var(--beat-color-pulse);
            background-image: radial-gradient(circle at center, rgba(255, 192, 203, 0.25) 0%, transparent 80%);
            color: #ffffff;
            font-family: 'Comic Sans MS';
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        canvas#lightning-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .main-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: blur(20px);
            transition: filter 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        .main-content.active {
            filter: blur(0px);
            pointer-events: auto;
        }

        .enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d11;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .enter-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 192, 203, 0.9),
                         0 0 30px rgba(255, 192, 203, 0.5);
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 5px solid #ffc0cb;
            box-shadow: 0 0 calc(20px + var(--beat-glow)) rgba(255, 192, 203, 0.6);
            margin-bottom: 20px;
            border-radius: 50%;
        }

        .title-container {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .typewriter-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 calc(15px + var(--beat-glow)) rgba(255, 192, 203, 0.8),
                         0 0 calc(30px + var(--beat-glow)) rgba(255, 192, 203, 0.5);
            letter-spacing: 2px;
            border-right: 3px solid #ffc0cb;
            white-space: nowrap;
            background: transparent;
            padding-right: 4px;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ffc0cb; }
        }

        .links-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-link {
            background: linear-gradient(135deg, #16161f 0%, #1f1f2e 100%);
            border: 1px solid #33334d;
            border-radius: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: all 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-link:hover {
            transform: translateY(-3px);
            border-color: #ffc0cb;
            box-shadow: 0 6px 25px rgba(255, 192, 203, 0.5);
        }

        .btn-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffb6c1;
            margin-bottom: 5px;
        }

        .btn-description {
            font-size: 0.9rem;
            color: #b0b0bc;
            line-height: 1.4;
        }

        .sub-locker {
            background: linear-gradient(135deg, #121218 0%, #171724 100%);
            border: 2px solid #ffc0cb;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 192, 203, 0.35);
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 40px;
            display: none;
        }

        .sub-locker h3 {
            color: #ffffff;
            margin-top: 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 192, 203, 0.6);
        }

        .sub-locker p {
            color: #b0b0bc;
            line-height: 1.6;
            margin: 10px 0 0;
        }
    </style>
</head>
<body>
    <div class="enter-overlay" id="enterOverlay">
        <div class="enter-text">P1nk flowers</div>
    </div>

    <div class="main-content" id="mainContent">
        <canvas id="lightning-canvas"></canvas>

        <div class="title-container">
            <img src="176.png" alt="Profile" class="profile-pic" id="profilePic">
        </div>

        <div class="title-container">
            <div class="typewriter-text" id="typewriter"></div>
        </div>

        <div class="links-container" id="linksContainer">
            <a href="index.html" class="card-link">
                <span class="btn-name">Main</span>
                <span class="btn-description">Back To Home</span>
            </a>

            <a href="idk.html" class="card-link">
                <span class="btn-name">P1nk flowers</span>
                <span class="btn-description">The Main Menu</span>
            </a>

            <a href="works.html" class="card-link">
                <span class="btn-name">Works</span>
                <span class="btn-description">All The P1nk flowers Works</span>
            </a>
        </div>
    </div>

    <a class="enter-link" id="enterLink" href="#">
        <div>
            <canvas id="lightning-canvas"></canvas>
        </div>
    </a>

    <script>
        const textArray = ["P1nk flowers"];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeSpeed = 150;
        const eraseSpeed = 100;
        const delayBetween = 2500;
        const typewriterElement = document.getElementById("typewriter");
        function type() {
            const currentText = textArray[textIndex];
            if (isDeleting) {
                typewriterElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let nextActionSpeed = isDeleting ? eraseSpeed : typeSpeed;
            if (!isDeleting && charIndex === currentText.length) {
                nextActionSpeed = delayBetween;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % textArray.length;
                nextActionSpeed = 500;
            }
            setTimeout(type, nextActionSpeed);
        }
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(type, 500);
        });
    </script>
</body>
</html>
